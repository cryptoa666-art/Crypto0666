name: ساخت فایل نصب گوشی

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: آدرس https اپ بعد از انتشار
        required: true
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: نوشتن آدرس اپ
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path
          url = os.environ["APP_URL"].strip()
          if not url.startswith("https://"):
              raise SystemExit("آدرس باید با https:// شروع شود")
          if not url.endswith("/"):
              url += "/"
          path = Path("android/app/src/main/res/values/strings.xml")
          text = path.read_text()
          text = text.replace("https://example.com/", url)
          path.write_text(text)
          PY
        env:
          APP_URL: ${{ inputs.app_url }}
      - name: ساخت APK
        working-directory: android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Crypto666-apk
          path: android/app/build/outputs/apk/debug/*.apk

